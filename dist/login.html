<!DOCTYPE html><html lang="sv"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Sidans titel -->
    <title>Logga in</title>
    <!-- Typsnitt och stilmall -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/admin.c92073ef.css">
</head>
<body class="page-login">
    <main class="main">
        <!-- Behållare för inloggningsformuläret -->
        <div class="login-container">
            <!-- Logotyp centrerad högst upp -->
            <div class="login-logo">
                <img src="/logotyp.030c7906.png" alt="Vaviorka logotyp">
            </div>
            <!-- Rubrik för inloggning -->
            <h1 class="login-title">Personalinloggning</h1>
            <!-- Formulär för inloggning -->
            <form class="form" id="loginForm">
                <!-- Användarnamn -->
                <div>
                    <label class="label" for="username">Användarnamn</label>
                    <input class="input" name="username" id="username" type="text" required="">
                </div>
                <!-- Lösenord -->
                <div>
                    <label class="label" for="password">Lösenord</label>
                    <input class="input" name="password" id="password" type="password" required="">
                </div>
                <!-- Skicka-knapp -->
                <button class="btn btn-primary" type="submit">Logga in</button>
            </form>
            <!-- Meddelande som visas vid fel eller lyckad inloggning -->
            <p class="message" id="message"></p>
        </div>
    </main>
    <!-- JavaScript som hanterar inloggningen -->
    <script src="/login.000f99f6.js"></script>

<script src="/login.e00df216.js"></script></body></html>
