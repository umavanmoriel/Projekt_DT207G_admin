<!DOCTYPE html><html lang="sv"><head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Administrationspanel</title>
        <link rel="stylesheet" href="/admin.c92073ef.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
        <link href="https://fonts.googleapis.com/css2?family=Aladin&amp;family=Cormorant+Garamond:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
    </head>
    <body class="admin-page">
        <header>
            <nav>
                <ul>
                    <li>Vaviorka</li>
                </ul>
            </nav>
            <button id="logout-button">Logga ut</button>
        </header>
        <main>
            <h1>Adminpanel</h1>

            <h2 id="formTitle">Lägg till rätt</h2>

            <form id="dishForm">
                <input type="hidden" id="dishId">

                <label for="dishName">Namn på rätt</label>
                <input type="text" id="dishName" name="name" required="">

                <div>
                    <div>
                        <label for="dishCategory">Kategori</label>
                        <select id="dishCategory" name="category" required="">
                            <option value="">-- Välj kategori --</option>
                            <option value="starters">Förrätter</option>
                            <option value="mainCourses">Varmrätter</option>
                            <option value="desserts">Efterrätter</option>
                            <option value="drinks">Drycker</option>
                        </select>
                    </div>
                    <div>
                        <label for="dishPrice">Pris (kr)</label>
                        <input type="number" id="dishPrice" name="price" min="0" step="1" required="">
                    </div>
                </div>

                <label for="dishDescription">Beskrivning</label>
                <textarea id="dishDescription" name="description"></textarea>

                <button type="submit" id="submitButton">Lägg till rätt</button>
                <button type="button" id="cancelButton" style="display: none">Avbryt</button>
                <div id="message"></div>
            </form>

            <h2>Meny</h2>
            <div id="menuContainer">

            </div>
        </main>
        <script src="/admin.882a59c0.js"></script>
    
<script src="/admin.a43fa255.js"></script></body></html>
