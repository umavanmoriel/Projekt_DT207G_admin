<!DOCTYPE html>
<html lang="sv">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Administrationspanel</title>
        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="../css/admin.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">    
    </head>
    <body class="admin-page">
        <header class="admin-header">
            <nav>
                <ul class="nav-list">
                    <li class="admin-nav-list-item">
                        <img class="logo-admin" src="../../assets/images/logotyp.png" alt="Vaviorka logotyp" height="44">
                    </li>
                </ul>
            </nav>
            <button class="btn-logout" id="logout-button">Logga ut</button>
        </header>
        <main class="main">
            <h1 class="title">Adminpanel</h1>

            <h2 class="subtitle" id="formTitle">Lägg till rätt</h2>

            <form class="form" id="dishForm">
                <input type="hidden" id="dishId">

                <label class="label" for="dishName">Namn på rätt</label>
                <input class="input" type="text" id="dishName" name="name">

                <div>
                    <div>
                        <label class="label" for="dishCategory">Kategori</label>
                        <select class="select" id="dishCategory" name="category">
                            <option value="">-- Välj kategori --</option>
                            <option value="starters">Förrätter</option>
                            <option value="mainCourses">Varmrätter</option>
                            <option value="desserts">Efterrätter</option>
                            <option value="drinks">Drycker</option>
                        </select>
                    </div>
                    <div class="form-col">
                        <label class="label" for="dishPrice">Pris (kr)</label>
                        <input class="input" type="number" id="dishPrice" name="price" min="0" step="1">
                    </div>
                </div>

                <label class="label" for="dishDescription">Beskrivning</label>
                <textarea class="textarea" id="dishDescription" name="description"></textarea>

                <button class="btn btn-primary" type="submit" id="submitButton">Lägg till rätt</button>
                <button class="btn btn-secondary" type="button" id="cancelButton" style="display:none;">Avbryt</button>
                <div class="message" id="message"></div>
            </form>

            <h2 class="subtitle">Meny</h2>
            <div class="menu-list" id="menuContainer">

            </div>
        </main>
        <script src="../js/admin.js"></script>
    </body>
</html>
